<style>
:root{--main:#ef7625;--dark:#b94d12;--bg:#fff8ef;--card:#fff;--text:#30251e;--muted:#806e60;--border:#f0dfd0;--shadow:0 5px 20px #6c3d1710}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(120deg,#ed7424,#ffad55);color:#fff;padding:16px 5%;position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}

.logo{font-size:25px;font-weight:bold}
nav{display:flex;gap:7px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:0}
nav button{background:#ffffff27;color:white;padding:9px 12px;border-radius:20px}
nav button.active,nav button:hover{background:#fff;color:var(--dark)}
.wrap{max-width:1150px;margin:auto;padding-left:15px;padding-right:15px}
.hero{margin:20px auto;padding:34px 22px;border-radius:22px;background:linear-gradient(120deg,#492a1ce8,#8d431ddd),url('https://images.unsplash.com/photo-1547592180-85f173990554?w=1200') center/cover;color:white}
.hero h1{font-size:clamp(27px,5vw,43px);margin:0 0 10px}
.hero p{line-height:1.9;max-width:700px}
.primary{background:var(--main);color:white;padding:12px 17px;border-radius:12px}
.secondary{background:#fff0e3;color:#a94e13;padding:10px 14px;border-radius:10px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
input,select{font:inherit;padding:13px;border:1px solid var(--border);border-radius:12px;background:white;min-width:0}
#search{flex:1;min-width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.recipe{background:var(--card);border:1px solid var(--border);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.recipe:hover{transform:translateY(-3px)}
.photo{height:165px;background:#f5dfc9;display:grid;place-items:center;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .emoji{position:absolute;font-size:58px;z-index:0}
.photo img{position:relative;z-index:1}
.photo img.bad{display:none}
.tag{position:absolute;top:10px;right:10px;background:#fff;color:#a94e13;border-radius:20px;padding:5px 10px;font-size:12px;z-index:2}
.info{padding:14px}
.info h3{margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
#details{display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin:20px 0;line-height:2}
#details img{width:100%;max-height:320px;object-fit:cover;border-radius:14px}
#details h2{color:var(--dark)}
#details li{margin:7px 0}
.recipe-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.section-title{margin:24px 0 14px}
footer{text-align:center;color:var(--muted);padding:25px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.note{background:#fff1df;border-right:4px solid var(--main);padding:12px 15px;border-radius:10px;margin:15px 0;line-height:1.8}
#install{display:none}
.dark{--bg:#191613;--card:#28221e;--text:#fff2e6;--muted:#c4ad9a;--border:#49382d;--shadow:0 5px 20px #0003}
.dark input,.dark select{background:#302923;color:white;border-color:#574333}
.dark .secondary{background:#49382d;color:#ffd0a5}
.dark .note{background:#3a2b20}
@media(max-width:600px){header{padding:13px 4%}.logo{width:100%}nav button{font-size:12px;padding:8px 10px}.hero{margin-top:12px;padding:25px 17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:125px}.info{padding:10px}.info h3{font-size:15px}.actions{gap:5px}.actions button{padding:9px 5px;font-size:12px}}
@media print{header,.hero,.tools,.actions,footer,#closeDetails{display:none!important}#details{display:block!important;border:0}}

<script>
const recipes = [
{
name:"ملوخية مصرية بالفراخ",cat:"غداء",emoji:"🍗",time:60,servings:4,
ingredients:["500 جرام ملوخية مفرومة طازجة أو مجمدة","دجاجة مقطعة أو 4 قطع دجاج","4 أكواب من مرقة الدجاج","5 فصوص ثوم مفروم","ملعقة كبيرة كزبرة جافة","ملعقة كبيرة سمن أو زبدة","ملح وفلفل وحبهان وورق لورا","أرز أبيض للتقديم"],
steps:["ضعي الدجاج في حلة وغطيه بالماء. أضيفي بصلة وحبهان وورق لورا وملحًا، واتركيه حتى يغلي ثم أزيلي الرغوة.","خففي النار واطهي الدجاج حتى ينضج تمامًا. ارفعيه واحتفظي بالمرقة بعد تصفيتها.","سخني 3 إلى 4 أكواب من المرقة في حلة. أضيفي الملوخية تدريجيًا مع التقليب حتى تذوب وتتجانس؛ لا تجعليها كثيفة جدًا.","اتركي الملوخية تسخن على نار هادئة حتى تظهر فقاعات خفيفة على الأطراف، ولا تتركيها تغلي بقوة.","في طاسة صغيرة سخني السمن، ثم أضيفي الثوم وقلبيه حتى يصفر قليلًا. أضيفي الكزبرة وقلبي ثواني حتى تفوح رائحتها.","اسكبي التقلية فورًا على الملوخية وقلبي. تذوقي واضبطي الملح.","قدميها ساخنة مع الأرز والدجاج، ويمكن تحمير الدجاج في الفرن بعد السلق."],

},
{
name:"صينية فراخ بالبطاطس",cat:"غداء",emoji:"🍗",time:75,servings:4,
ingredients:["كيلو دجاج مقطع 4 إلى 8 قطع","4 حبات بطاطس متوسطة","2 بصلة كبيرة","2 حبة طماطم","4 فصوص ثوم مهروس","3 ملاعق كبيرة زيت","ملعقة صغيرة بابريكا","نصف ملعقة كمون","ملح وفلفل أسود","كوب مرقة أو ماء"],
steps:["سخني الفرن إلى 200 درجة مئوية. اغسلي الدجاج وجففيه جيدًا.","اخلطي الزيت والثوم والبابريكا والكمون والملح والفلفل، وادهني قطع الدجاج بالخليط واتركيها 15 دقيقة.","قشري البطاطس وقطعيها شرائح متوسطة. قطعي البصل والطماطم شرائح.","وزعي البطاطس والبصل والطماطم في صينية، ورشي قليلًا من الملح والفلفل.","رصي قطع الدجاج فوق الخضار واسكبي المرقة في قاع الصينية دون غسل التتبيلة عن الدجاج.","غطي الصينية بورق فويل وأدخليها الفرن 40 دقيقة تقريبًا.","انزعي الفويل واستمري في التسوية 20 إلى 30 دقيقة حتى يتحمر الدجاج وتنضج البطاطس تمامًا. إذا جفت الصينية أضيفي قليلًا من الماء الساخن.","قدميها ساخنة مع الأرز أو الخبز."],
tip:"يختلف الوقت حسب حجم قطع الدجاج والفرن. تأكدي من نضج الدجاج من الداخل قبل التقديم."
},
{
name:"كفتة داوود باشا",cat:"غداء",emoji:"🍲",time:50,servings:4,
ingredients:["500 جرام لحم مفروم","بصلة صغيرة مبشورة ومصفاة","ملعقتان بقدونس مفروم","نصف ملعقة صغيرة بهارات لحمة","ملح وفلفل","2 ملعقة زيت","بصلة صغيرة مفرومة للصلصة","2 كوب عصير طماطم","ملعقة كبيرة صلصة طماطم","نصف ملعقة صغيرة سكر اختياري"],
steps:["اخلطي اللحم مع البصل المبشور والبقدونس والبهارات والملح والفلفل حتى يتجانس.","بللي يديك بقليل من الماء وشكلي اللحم كرات صغيرة متساوية.","سخني الزيت في حلة واسعة وحمري كرات الكفتة على دفعات حتى تأخذ لونًا من الخارج، ثم ارفعيها جانبًا.","في نفس الحلة شوحي البصل المفروم حتى يذبل، ثم أضيفي عصير الطماطم والصلصة والملح والفلفل.","اتركي الصلصة تتسبك 10 إلى 15 دقيقة حتى يخف الماء ويظهر الزيت على الوجه.","أعيدي كرات الكفتة إلى الصلصة، وغطي الحلة واتركيها على نار هادئة 15 إلى 20 دقيقة حتى تنضج من الداخل.","تذوقي الصلصة واضبطي الملح. قدمي الكفتة مع الأرز الأبيض."],
tip:"حمري الكرات برفق ولا تقلبيها كثيرًا قبل أن تتماسك. يمكن إضافة رشة قرفة صغيرة للنكهة."
},
{
name:"مسقعة باللحمة المفرومة",cat:"غداء",emoji:"🍆",time:65,servings:5,
ingredients:["2 حبة باذنجان كبيرة","300 جرام لحم مفروم","بصلة كبيرة مفرومة","فلفلة خضراء مقطعة","3 فصوص ثوم","3 حبات طماطم مبشورة","ملعقة كبيرة صلصة طماطم","2 ملعقة زيت","ملح وفلفل وكمون"],
steps:["قطعي الباذنجان شرائح متوسطة، ورشي عليه قليلًا من الملح واتركيه 15 دقيقة ثم جففيه.","ادهني شرائح الباذنجان بالزيت ورصيها في صينية، ثم حمريها في فرن 220 درجة مع التقليب حتى تلين وتأخذ لونًا.","في طاسة شوحي نصف البصل ثم أضيفي اللحم المفروم والملح والفلفل وقلبي حتى يتغير لونه وينضج.","في حلة أخرى شوحي باقي البصل والفلفل، ثم أضيفي الثوم والكمون.","أضيفي الطماطم المبشورة والصلصة واتركيها تتسبك 10 دقائق.","رصي طبقة باذنجان في صينية، ثم اللحم، ثم باقي الباذنجان واسكبي الصلصة.","أدخلي الصينية فرنًا ساخنًا 15 إلى 20 دقيقة حتى تتجانس النكهات. قدميها مع الخبز أو الأرز."],
tip:"تحمير الباذنجان في الفرن يقلل كمية الزيت. لا تجعلي شرائح الباذنجان رفيعة جدًا حتى لا تتهرى."
},
{
name:"كشري مصري",cat:"غداء",emoji:"🍛",time:75,servings:5,
ingredients:["كوب أرز مصري","كوب عدس بجبة","كوب مكرونة صغيرة","كوب حمص مسلوق","2 بصلة كبيرة شرائح","نصف كوب شعرية","2 كوب عصير طماطم","4 فصوص ثوم","ربع كوب خل","كمون وملح وفلفل وزيت","شعيرية أو مكرونة إضافية حسب الرغبة"],
steps:["اغسلي العدس واسلقيه في ماء حتى يقترب من النضج، ثم صفيه واحتفظي بقليل من ماء السلق.","حمري الشعرية في ملعقة زيت حتى تصبح ذهبية، أضيفي الأرز المغسول والملح والماء المناسب، ثم اطهيه حتى ينضج.","اسلقي المكرونة في ماء مغلي وملح حسب زمن العبوة ثم صفيها.","قطعي البصل شرائح رفيعة وحمريه في زيت متوسط الحرارة حتى يصبح بنيًا ومقرمشًا، ثم ارفعيه على ورق مطبخ.","لصلصة الطماطم: شوحي فصين ثوم، أضيفي عصير الطماطم والملح والكمون واتركيها تتسبك.","للدقة: اخلطي باقي الثوم مع الخل والكمون وقليل من الماء والملح، وسخنيها دقيقة.","قدمي طبقة أرز وعدس، ثم المكرونة والحمص، وضعي الصلصة والدقة والبصل المقرمش على الوجه."],
tip:"جهزي مكونات الكشري كلًا على حدة ثم ركبي الطبق عند التقديم. احتفظي بقليل من ماء العدس لإضافة نكهة للعدس أو الأرز."
},
{
name:"مكرونة بالبشاميل",cat:"غداء",emoji:"🍝",time:80,servings:6,
ingredients:["500 جرام مكرونة قلم","400 جرام لحم مفروم","بصلة مفرومة","4 ملاعق كبيرة زبدة","4 ملاعق كبيرة دقيق","4 أكواب لبن","ملح وفلفل وجوزة الطيب","ملعقة زيت","بيضة اختيارية لوجه الصينية"],
steps:["اسلقي المكرونة في ماء مغلي وملح حتى تصبح أقل من النضج الكامل بدقيقتين، ثم صفيها.","شوحي البصل في ملعقة زيت حتى يذبل، أضيفي اللحم والملح والفلفل وقلبي حتى ينضج ويتبخر سائله.","للبشاميل: ذوبي الزبدة في حلة، أضيفي الدقيق وقلبي دقيقة دون أن يتغير لونه كثيرًا.","أضيفي اللبن تدريجيًا مع الخفق المستمر حتى لا تتكون كتل. اتركيه على نار متوسطة حتى يثقل.","تبلي البشاميل بالملح والفلفل ورشة جوزة الطيب.","اخلطي جزءًا من البشاميل مع المكرونة. ضعي نصفها في صينية، ثم اللحم، ثم باقي المكرونة.","اسكبي بقية البشاميل على الوجه. يمكن خفق بيضة مع ملعقتين لبن ودهن الوجه بها.","اخبزي في فرن 190 درجة لمدة 30 إلى 40 دقيقة حتى يتماسك الوجه ويحمر. اتركيها 10 دقائق قبل التقطيع."],
tip:"لا تسلقي المكرونة زيادة لأنها ستكمل نضجها في الفرن. أضيفي اللبن للبشاميل بالتدريج مع الخفق."
},
{
name:"فاصوليا بيضاء باللحمة",cat:"غداء",emoji:"🥘",time:100,servings:5,
ingredients:["كوب ونصف فاصوليا بيضاء جافة","400 جرام لحم مكعبات","بصلة","3 أكواب عصير طماطم","ملعقة كبيرة صلصة","3 فصوص ثوم","2 ملعقة زيت","ملح وفلفل وكمون"],
steps:["انقعي الفاصوليا في ماء وفير من 8 إلى 12 ساعة، ثم صفيها واغسليها.","اسلقي اللحم في ماء مع البصل حتى يقترب من النضج، واحتفظي بالمرقة.","اسلقي الفاصوليا في ماء جديد حتى تلين جزئيًا، ثم صفيها.","شوحي الثوم في الزيت ثواني، ثم أضيفي عصير الطماطم والصلصة والكمون والملح والفلفل.","اتركي الصلصة تتسبك حتى يخف ماؤها، ثم أضيفي الفاصوليا واللحم وكوبًا أو كوبين من المرقة.","غطي الحلة واتركيها على نار هادئة حتى تنضج الفاصوليا تمامًا ويصبح القوام مناسبًا.","قدميها مع الأرز الأبيض."],
tip:"قد تختلف مدة سلق الفاصوليا حسب عمر الحبوب. لا تضيفي الملح بكثرة قبل أن تلين الحبوب."
},
{
name:"بامية باللحمة",cat:"غداء",emoji:"🍲",time:90,servings:5,
ingredients:["500 جرام بامية","400 جرام لحم مكعبات","3 أكواب عصير طماطم","ملعقة كبيرة صلصة","بصلة صغيرة","5 فصوص ثوم","ملعقة صغيرة كزبرة جافة","2 ملعقة سمن أو زيت","ملح وفلفل"],
steps:["اسلقي اللحم مع البصل والملح حتى يقترب من النضج واحتفظي بالمرقة.","اغسلي البامية وجففيها، ثم أزيلي الجزء العلوي دون فتح القرون.","في حلة شوحي عصير الطماطم مع الصلصة حتى تتسبك ويقل حجمها.","أضيفي البامية واللحم وكوبًا من المرقة، وقلبي برفق.","اتركي الحلة على نار هادئة حتى تنضج البامية واللحمة، مع إضافة مرقة عند الحاجة.","في طاسة سخني السمن وأضيفي الثوم المفروم والكزبرة حتى تظهر الرائحة ويصفر الثوم.","أضيفي التقلية إلى البامية وقلبي الحلة برفق، ثم ارفعيها عن النار.","قدميها مع الأرز الأبيض."],
tip:"لا تكثري التقليب بالملعقة حتى لا تتقطع قرون البامية."
},
{
name:"محشي كرنب",cat:"غداء",emoji:"🥬",time:110,servings:6,
ingredients:["رأس كرنب متوسطة","2 كوب أرز مصري","بصلتان مفرومتان","كوب عصير طماطم","ملعقة صلصة","نصف كوب بقدونس وشبت وكزبرة مفرومين","3 ملاعق زيت","ملح وفلفل وكمون ونعناع جاف","مرقة ساخنة"],
steps:["افصلي أوراق الكرنب بحذر، واسلقيها على دفعات في ماء مغلي حتى تلين قليلًا دون أن تتفتت.","صفي الأوراق واتركيها تبرد، ثم قطعي العروق السميكة لتسهيل اللف.","اغسلي الأرز وصفيه. اخلطيه مع البصل والطماطم والصلصة والخضرة والزيت والملح والفلفل والكمون والنعناع.","قطعي الورق إلى مستطيلات مناسبة. ضعي مقدارًا صغيرًا من الحشوة ولفي الورقة مع إغلاق الجانبين.","رصي المحشي في حلة متقاربًا، وضعي طبقًا صغيرًا مقاومًا للحرارة فوقه لتثبيته إن لزم.","اسكبي المرقة الساخنة حتى تقترب من مستوى المحشي دون أن تغمره كثيرًا.","اتركيه يغلي، ثم خففي النار وغطي الحلة واطهيه 35 إلى 50 دقيقة حسب حجم اللفائف حتى ينضج الأرز.","اتركيه يرتاح دقائق ثم اقلبيه أو قدميه مباشرة."],
tip:"لا تملئي الورق حتى آخره؛ الأرز يتمدد أثناء التسوية. تأكدي من نضج الأرز قبل إطفاء النار."
},
{
name:"محشي فلفل أخضر",cat:"غداء",emoji:"🫑",time:85,servings:5,
ingredients:["8 حبات فلفل أخضر متوسط","كوب ونصف أرز مصري","بصلة مفرومة","كوب عصير طماطم","ملعقة صلصة","نصف كوب خضرة مفرومة","2 ملعقة زيت","ملح وفلفل وكمون","مرقة ساخنة"],
steps:["اغسلي الفلفل واقطعي الغطاء العلوي واحتفظي به، ثم أزيلي البذور والأغشية البيضاء.","اغسلي الأرز وصفيه جيدًا.","اخلطي الأرز مع البصل وعصير الطماطم والصلصة والخضرة والزيت والملح والفلفل والكمون.","املئي كل حبة حتى ثلاثة أرباعها فقط واتركي فراغًا لتمدد الأرز.","رصي الفلفل قائمًا في حلة مناسبة وأعيدي الأغطية فوقه إن رغبتِ.","أضيفي المرقة الساخنة حول الحبات حتى تصل إلى منتصف ارتفاعها تقريبًا.","غطي الحلة واتركيها تغلي، ثم خففي النار واطهيها حتى ينضج الأرز تمامًا.","اختبري حبة للتأكد من النضج ثم قدميها ساخنة."],
tip:"اختاري حبات متقاربة الحجم حتى تنضج في وقت متقارب، ولا تضغطي الحشوة داخل الفلفل."
},
{
name:"أرز معمر حادق",cat:"غداء",emoji:"🍚",time:65,servings:4,
ingredients:["2 كوب أرز مصري","2 كوب لبن كامل الدسم","كوب مرقة دجاج أو ماء","2 ملعقة كبيرة قشطة","ملعقة زبدة","ملح وفلفل","رشة جوزة الطيب اختيارية"],
steps:["سخني الفرن إلى 180 درجة مئوية وادهني طاجنًا متوسطًا بالزبدة.","اغسلي الأرز وصفيه جيدًا ثم ضعيه في الطاجن.","اخلطي اللبن والمرقة والملح والفلفل، ثم اسكبي الخليط فوق الأرز.","وزعي القشطة والزبدة على الوجه. يجب أن يغطي السائل الأرز قليلًا.","أدخلي الطاجن الفرن دون غطاء لمدة 45 إلى 60 دقيقة، حتى يتشرب الأرز السائل وينضج ويحمر الوجه.","إذا تحمر الوجه مبكرًا وكان الأرز ما زال قاسيًا، غطي الطاجن بورق فويل وأكملي التسوية.","اتركيه يرتاح 10 دقائق قبل التقديم."],
tip:"استخدمي طاجنًا مناسبًا لحجم الكمية. قد يحتاج الأرز ماءً أو لبنًا إضافيًا حسب نوعه."
},
{
name:"كبدة إسكندراني",cat:"غداء",emoji:"🥩",time:25,servings:3,
ingredients:["500 جرام كبدة بقري شرائح رفيعة","4 فصوص ثوم مفروم","فلفلتان خضراوان شرائح","2 ملعقة زيت","عصير ليمونة","ملعقة صغيرة كمون","نصف ملعقة كزبرة جافة","ملح وفلفل وشطة حسب الرغبة"],
steps:["قطعي الكبدة شرائح رفيعة وجففيها بمنديل مطبخ. احتفظي بها مبردة حتى وقت الطهي.","اخلطي الثوم والكمون والكزبرة والليمون والفلفل والشطة.","سخني طاسة واسعة على نار عالية نسبيًا وأضيفي الزيت.","أضيفي الكبدة على دفعات حتى لا تتكدس، وقلبيها حتى يتغير لونها.","أضيفي خليط الثوم والفلفل الأخضر وقلبي حتى تنضج الكبدة تمامًا.","أضيفي الملح في النهاية واضبطي الليمون والتوابل.","قدميها فورًا في عيش بلدي مع الطحينة والمخلل."],
tip:"لا تزدحمي بالطاسة؛ الطهي على دفعات يساعد على تحمير الكبدة بدل سلقها في سوائلها. يجب أن تنضج تمامًا."
},
{
name:"شاورما فراخ منزلية",cat:"غداء",emoji:"🌯",time:45,servings:4,
ingredients:["600 جرام صدور أو أوراك دجاج مخلية شرائح","3 ملاعق زبادي","ملعقة كبيرة خل","عصير نصف ليمونة","2 فص ثوم مهروس","ملعقة صغيرة بابريكا","نصف ملعقة كمون","نصف ملعقة كزبرة جافة","ملح وفلفل","بصلة وفلفلة شرائح"],
steps:["قطعي الدجاج شرائح رفيعة متقاربة الحجم.","اخلطي الزبادي والخل والليمون والثوم والبابريكا والكمون والكزبرة والملح والفلفل.","قلبي الدجاج في التتبيلة وغطيه واتركيه في الثلاجة 30 دقيقة على الأقل.","سخني طاسة واسعة وأضيفي قليلًا من الزيت. اطهي الدجاج على دفعات حتى يتحمر وينضج من الداخل.","أضيفي البصل والفلفل في آخر دقائق الطهي حتى يلين قليلًا مع بقائه محتفظًا بقوامه.","تأكدي من نضج الدجاج تمامًا، ثم قدميه في خبز مع الثومية أو الطحينة والمخلل."],
tip:"الأوراك المخلية تبقى أكثر طراوة، أما الصدور فتحتاج عدم المبالغة في الطهي حتى لا تجف."
},
{
name:"سمك صيادية",cat:"غداء",emoji:"🐟",time:55,servings:4,
ingredients:["4 سمكات صغيرة منظفة أو 4 قطع فيليه","2 كوب أرز","3 بصلات كبيرة شرائح","3 ملاعق زيت","ملعقة صغيرة كمون","نصف ملعقة كزبرة جافة","ملح وفلفل","3 أكواب ماء ساخن أو مرقة سمك","ليمون للتقديم"],
steps:["جففي السمك وتبليه بالملح والكمون والفلفل والليمون واتركيه 15 دقيقة في الثلاجة.","حمري شرائح البصل في الزيت على نار متوسطة مع التقليب حتى تصبح بنية داكنة دون احتراق.","ارفعي جزءًا من البصل للتزيين، وأضيفي الماء الساخن بحذر إلى الحلة ثم الكمون والكزبرة والملح.","اتركي ماء البصل يغلي دقائق ثم صفيه إذا رغبتِ في أرز بلون متجانس، أو اتركي البصل حسب القوام التقليدي الذي تفضلينه.","أضيفي الأرز المغسول إلى السائل، واتركيه يغلي ثم خففي النار وغطيه حتى ينضج.","اشوي السمك أو اقليه في كمية مناسبة من الزيت حتى ينضج تمامًا، بحسب نوع السمك وسماكته.","قدمي السمك مع أرز الصيادية والبصل المحمر والليمون."],
tip:"راقبي البصل باستمرار؛ احتراقه يعطي ماء الصيادية طعمًا مرًا. يختلف وقت طهي السمك حسب حجمه."
},
{
name:"صينية كفتة بالطحينة",cat:"غداء",emoji:"🥘",time:55,servings:4,
ingredients:["500 جرام لحم مفروم","بصلة صغيرة مبشورة ومصفاة","ربع كوب بقدونس مفروم","ملح وفلفل وبهارات لحمة","نصف كوب طحينة","عصير ليمونة","فص ثوم مهروس","نصف كوب ماء بارد تقريبًا"],
steps:["سخني الفرن إلى 200 درجة مئوية.","اخلطي اللحم مع البصل والبقدونس والملح والفلفل والبهارات حتى يتجانس.","افردي الكفتة في صينية مدهونة أو شكليها أصابع ورصيها في الصينية.","أدخليها الفرن 12 إلى 15 دقيقة حتى تبدأ في التماسك ويخرج جزء من الدهن.","اخلطي الطحينة مع الليمون والثوم، ثم أضيفي الماء تدريجيًا مع التقليب حتى تصبح صلصة سائلة متوسطة القوام.","اسكبي الطحينة فوق الكفتة وأعيدي الصينية إلى الفرن 15 إلى 20 دقيقة حتى تنضج الكفتة وتتماسك الصلصة.","قدميها ساخنة مع الأرز أو الخبز."],
tip:"الطحينة تثقل عند إضافة الليمون أولًا؛ خففيها بالماء تدريجيًا حتى تصلي للقوام المطلوب."
},
{
name:"فراخ بالكريمة والمشروم",cat:"غداء",emoji:"🍗",time:40,servings:4,
ingredients:["500 جرام صدور دجاج مكعبات أو شرائح","200 جرام مشروم شرائح","بصلة صغيرة مفرومة","2 فص ثوم","ملعقة زيت وملعقة زبدة","كوب كريمة طبخ أو لبن مع ملعقة دقيق","ملح وفلفل","نصف ملعقة زعتر"],
steps:["تبلي الدجاج بالملح والفلفل والزعتر.","سخني الزيت والزبدة في طاسة واسعة، ثم حمري الدجاج على دفعات حتى يأخذ لونًا وينضج تمامًا. ارفعيه جانبًا.","في نفس الطاسة شوحي البصل حتى يذبل، ثم أضيفي الثوم والمشروم واطهي حتى يتبخر ماء المشروم.","أعيدي الدجاج إلى الطاسة وأضيفي الكريمة.","اتركي الصوص على نار هادئة 4 إلى 6 دقائق حتى يثقل قليلًا دون غليان شديد.","إذا استخدمت اللبن بدل الكريمة، اخلطيه بملعقة دقيق قبل إضافته واطهيه مع التقليب حتى يتماسك.","تذوقي واضبطي الملح والفلفل وقدميه مع المكرونة أو الأرز."],
tip:"لا تضعي الدجاج كله مرة واحدة في الطاسة حتى لا تنخفض الحرارة ويخرج الماء."
},
{
name:"طاجن لسان عصفور بالدجاج",cat:"غداء",emoji:"🥘",time:55,servings:4,
ingredients:["كوب ونصف لسان عصفور","400 جرام دجاج مكعبات","بصلة مفرومة","2 ملعقة زيت أو سمن","2 كوب مرقة ساخنة","ملعقة صلصة طماطم","ملح وفلفل وحبهان"],
steps:["سخني الفرن إلى 190 درجة مئوية.","حمري لسان العصفور في السمن مع التقليب حتى يصبح ذهبيًا فاتحًا، ثم ارفعيه.","في نفس الحلة شوحي البصل ثم أضيفي الدجاج والملح والفلفل والحبهان وقلبي حتى يتغير لون الدجاج.","أضيفي الصلصة وقلبي دقيقة، ثم أعيدي لسان العصفور.","اسكبي المرقة الساخنة وقلبي، ثم انقلي الخليط إلى طاجن فرن.","غطي الطاجن بورق فويل واخبزيه 20 دقيقة، ثم افحصي النضج وأضيفي قليلًا من المرقة الساخنة إذا احتاج.","أزيلي الفويل واتركيه دقائق حتى يتشرب السائل وينضج تمامًا."],
tip:"لسان العصفور يمتص المرقة بسرعة؛ لا تتركيه في الفرن دون متابعة."
},
{
name:"عدس أصفر بالشعرية",cat:"غداء",emoji:"🍲",time:40,servings:4,

steps:["اغسلي العدس جيدًا وصفيه.","ضعي العدس والجزر والبصل والطماطم والثوم والماء في حلة.","اتركي الخليط يغلي ثم خففي النار واطهيه 25 دقيقة تقريبًا حتى تلين المكونات.","اتركيه يهدأ قليلًا ثم اخلطيه بالخلاط اليدوي أو العادي حتى يصبح ناعمًا، وأعيديه للحلة.","في طاسة حمري الشعرية في الزيت حتى تصبح ذهبية.","أضيفي الشعرية إلى الشوربة واتركيها تنضج 7 إلى 10 دقائق مع التقليب.","اضبطي الملح والكمون والقوام بإضافة ماء ساخن عند الحاجة، وقدميه مع الخبز والليمون."],

},
{
name:"حواوشي بلدي",cat:"غداء",emoji:"🥙",time:45,servings:4,

steps:["اخلطي اللحم مع البصل والفلفل والطماطم والملح والفلفل والبهارات والبابريكا.","قسمي الحشوة إلى أربعة أجزاء متساوية.","افتحي كل رغيف من الجانب ووزعي الحشوة بطبقة رفيعة متساوية حتى الأطراف.","ادهني الخبز من الخارج بقليل من الزيت.","لفي كل رغيف في ورق زبدة ثم فويل، واخبزيه في فرن 200 درجة نحو 15 دقيقة.","افتحي الفويل بحذر وأعيدي الأرغفة للفرن 5 إلى 10 دقائق حتى يتحمص الخبز وتنضج الحشوة تمامًا.","قدمي الحواوشي ساخنًا مع السلطة والطحينة."],

},

},
{

steps:["اسلقي المكرونة في ماء مغلي وملح حسب تعليمات العبوة، ثم صفيها واحتفظي بنصف كوب من ماء السلق.","سخني الزيت وأضيفي الثوم وقلبيه ثواني حتى تظهر رائحته دون أن يحترق.","أضيفي عصير الطماطم والصلصة والملح والفلفل.","اتركي الصلصة على نار متوسطة 10 إلى 12 دقيقة حتى تتسبك.","أضيفي المكرونة وقلبيها في الصلصة. استخدمي قليلًا من ماء السلق إذا احتاجت.","قدميها ساخنة ويمكن إضافة جبنة مبشورة."],

},

{

const grid=document.getElementById("recipes");
const details=document.getElementById("details");
const search=document.getElementById("search");
let category="الكل";
let onlyFav=false;
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem("sofretnaFavs")||"[]");if(!Array.isArray(favorites))favorites=[];}catch(e){favorites=[];}

function imageURL(recipe){
 const query=encodeURIComponent(recipe.name.replaceAll(" ","-"));
 return "https://loremflickr.com/700/450/food,"+query;
}
function render(){
 let list=recipes.filter(r=>{
  const catMatch=category==="الكل"||r.cat===category;
  const searchMatch=(r.name+" "+r.ingredients.join(" ")+" "+r.cat).toLowerCase().includes(search.value.trim().toLowerCase());
  const favMatch=!onlyFav||favorites.includes(r.name);
  return catMatch&&searchMatch&&favMatch;
 });
 const sort=document.getElementById("sort").value;
 if(sort==="short")list.sort((a,b)=>a.time-b.time);
 if(sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
 grid.innerHTML="";
 document.getElementById("empty").hidden=list.length!==0;
 list.forEach(r=>{
  const card=document.createElement("article");
  card.className="recipe";
  const img=document.createElement("img");
  img.src=imageURL(r);
  img.alt=r.name;
  img.loading="lazy";
  img.onerror=()=>img.classList.add("bad");
  const photo=document.createElement("div");
  photo.className="photo";
  const emoji=document.createElement("span");
  emoji.className="emoji";
  emoji.textContent=r.emoji;
  const tag=document.createElement("small");
  tag.className="tag";
  tag.textContent=r.cat;
  photo.append(emoji,img,tag);
  const info=document.createElement("div");
  info.className="info";
  const h=document.createElement("h3");h.textContent=r.name;
  const p=document.createElement("p");p.className="muted";p.textContent="⏱️ "+r.time+" دقيقة · 👥 "+r.servings+" أفراد";
  const actions=document.createElement("div");actions.className="actions";
  const open=document.createElement("button");open.className="primary";open.textContent="عرض الوصفة";open.onclick=()=>openRecipe(r.name);
  const fav=document.createElement("button");fav.className="secondary";fav.textContent=favorites.includes(r.name)?"❤️":"🤍";fav.setAttribute("aria-label","إضافة للمفضلة");fav.onclick=()=>toggleFavorite(r.name);
  actions.append(open,fav);info.append(h,p,actions);card.append(photo,info);grid.append(card);
 });
 document.getElementById("heading").textContent=onlyFav?"وصفاتي المفضلة ❤️":category==="الكل"?"كل الوصفات 🍽️":category;
}
function toggleFavorite(name){
 favorites=favorites.includes(name)?favorites.filter(x=>x!==name):[...favorites,name];
 try{localStorage.setItem("sofretnaFavs",JSON.stringify(favorites));}catch(e){}
 render();
}
function openRecipe(name){
 const r=recipes.find(x=>x.name===name);if(!r)return;
 details.style.display="block";
 details.innerHTML="";
 const close=document.createElement("button");close.id="closeDetails";close.className="secondary";close.textContent="✖ إغلاق";close.onclick=()=>details.style.display="none";
 const h=document.createElement("h2");h.textContent=r.emoji+" "+r.name;
 const meta=document.createElement("p");meta.className="recipe-meta";meta.textContent="⏱️ "+r.time+" دقيقة  ·  👥 تكفي "+r.servings+" أفراد  ·  "+r.cat;
 const note=document.createElement("div");note.className="note";note.textContent="اقرأ المقادير والخطوات كاملة قبل البدء، وجهّز المكونات وأدوات الطهي.";
 const ingTitle=document.createElement("h3");ingTitle.textContent="🧺 المقادير";
 const ul=document.createElement("ul");r.ingredients.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.append(li);});
 const stepTitle=document.createElement("h3");stepTitle.textContent="👨‍🍳 طريقة التحضير بالتفصيل";
 const ol=document.createElement("ol");r.steps.forEach(x=>{const li=document.createElement("li");li.textContent=x;ol.append(li);});
 const tipTitle=document.createElement("h3");tipTitle.textContent="💡 سر نجاح الوصفة";
 const tip=document.createElement("p");tip.textContent=r.tip;
 const print=document.createElement("button");print.className="primary";print.textContent="🖨️ طباعة الوصفة";print.onclick=()=>window.print();
 details.append(close,h,meta,note,ingTitle,ul,stepTitle,ol,tipTitle,tip,print);
 details.scrollIntoView({behavior:"smooth",block:"start"});
}
document.querySelectorAll("nav [data-cat]").forEach(btn=>btn.addEventListener("click",()=>{
 onlyFav=false;category=btn.dataset.cat;
 document.querySelectorAll("nav [data-cat]").forEach(x=>x.classList.toggle("active",x===btn));
 render();
}));
document.getElementById("favBtn").addEventListener("click",()=>{onlyFav=!onlyFav;category="الكل";document.querySelectorAll("nav [data-cat]").forEach(x=>x.classList.toggle("active",x.dataset.cat==="الكل"&&!onlyFav));render();});
search.addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("theme").addEventListener("click",()=>{
 document.body.classList.toggle("dark");
 try{localStorage.setItem("sofretnaDark",document.body.classList.contains("dark"));}catch(e){}
});
try{if(localStorage.getItem("sofretnaDark")==="true")document.body.classList.add("dark");}catch(e){}
document.getElementById("year").textContent=new Date().getFullYear();
render();
let installPrompt=null;
const installBtn=document.getElementById("install");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;installBtn.style.display="inline-block";});
installBtn.addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.style.display="none";});
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.log("Service worker:",err)));
}
</script>
</body>
</html>
