<style>
:root{--main:#ef7625;--dark:#b94d12;--bg:#fff8ef;--card:#fff;--text:#30251e;--muted:#806e60;--border:#f0dfd0}

.hero h1{font-size:clamp(27px,5vw,43px);margin:0 0 10px}.hero p{line-height:1.9;max-width:700px}.primary{background:var(--main);color:white;padding:11px 15px;border-radius:11px}.secondary{background:#fff0e3;color:#a94e13;padding:10px 13px;border-radius:10px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}input,select{font:inherit;padding:12px;border:1px solid var(--border);border-radius:12px;background:white;min-width:0}#search{flex:1;min-width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.recipe{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #6c3d1710}.photo{height:165px;background:#f5dfc9;display:grid;place-items:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .emoji{position:absolute;font-size:58px}.photo img{position:relative;z-index:1}.photo img.bad{display:none}.tag{position:absolute;top:9px;right:9px;background:#fff;color:#a94e13;border-radius:20px;padding:5px 10px;font-size:12px;z-index:2}
.info{padding:13px}.info h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
#details{display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin:20px 0;line-height:2}#details h2{color:var(--dark)}#details li{margin:7px 0}.recipe-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.section-title{margin:24px 0 14px}footer{text-align:center;color:var(--muted);padding:25px}.empty{text-align:center;padding:30px;color:var(--muted)}
#downloadStatus{display:none;background:#fff1df;border-right:4px solid var(--main);padding:12px 14px;border-radius:10px;margin:15px auto;line-height:1.8}
.progress{height:9px;background:#ead8c7;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;width:0;background:var(--main);transition:width .2s}
.dark{--bg:#191613;--card:#28221e;--text:#fff2e6;--muted:#c4ad9a;--border:#49382d}.dark input,.dark select{background:#302923;color:white}.dark .secondary{background:#49382d;color:#ffd0a5}
@media(max-width:600px){header{padding:12px 4%}.logo{width:100%}nav button{font-size:12px;padding:8px}.hero{margin-top:12px;padding:24px 17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:125px}.info{padding:10px}.info h3{font-size:15px}.actions{gap:5px}.actions button{padding:8px 4px;font-size:12px}}

<script>
const photos={
chicken:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=800&q=78",rice:"https://images.unsplash.com/photo-1516684732162-798a0062be99?w=800&q=78",pasta:"https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=800&q=78",soup:"https://images.unsplash.com/photo-1547592180-85f173990554?w=800&q=78",meat:"https://images.unsplash.com/photo-1544025162-d76694265947?w=800&q=78",fish:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=800&q=78",potato:"https://images.unsplash.com/photo-1518977676601-b53f82abe8dd?w=800&q=78",noodles:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=800&q=78",drink:"https://images.unsplash.com/photo-1544145945-f90425340c7e?w=800&q=78",juice:"https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=800&q=78",dessert:"https://images.unsplash.com/photo-1547592180-85f173990554?w=800&q=78"
};
const recipes=[
{name:"ملوخية مصرية بالفراخ",cat:"غداء",emoji:"🍗",time:60,servings:4,img:"soup",ingredients:["500 جرام ملوخية مفرومة","4 قطع دجاج","4 أكواب مرقة","5 فصوص ثوم","ملعقة كزبرة جافة","ملعقة سمن","ملح وفلفل وحبهان"],steps:["اسلقي الدجاج مع البصل والحبهان والملح حتى ينضج تمامًا واحتفظي بالمرقة.","سخني المرقة وأضيفي الملوخية تدريجيًا مع التقليب حتى تتجانس.","اتركيها على نار هادئة حتى تسخن دون غليان قوي.","حمري الثوم في السمن ثم أضيفي الكزبرة وقلبي ثواني.","أضيفي التقلية إلى الملوخية وقدميها مع الأرز والدجاج."],tip:"لا تتركي الملوخية تغلي بقوة حتى تحافظ على قوامها."},
{name:"صينية فراخ بالبطاطس",cat:"غداء",emoji:"🍗",time:75,servings:4,img:"chicken",ingredients:["كيلو دجاج مقطع","4 بطاطس","2 بصلة","2 طماطم","4 فصوص ثوم","3 ملاعق زيت","بابريكا وكمون وملح وفلفل","كوب مرقة"],steps:["سخني الفرن إلى 200 درجة.","تبلي الدجاج بالثوم والزيت والبابريكا والكمون والملح والفلفل.","قطعي البطاطس والبصل والطماطم وضعيها في صينية.","رصي الدجاج فوق الخضار واسكبي المرقة حوله.","غطي الصينية 40 دقيقة ثم اكشفيها 20 إلى 30 دقيقة حتى ينضج الدجاج ويتحمر."],tip:"تأكدي من نضج الدجاج تمامًا من الداخل قبل التقديم."},
{name:"كفتة داوود باشا",cat:"غداء",emoji:"🍲",time:50,servings:4,img:"meat",ingredients:["500 جرام لحم مفروم","بصلة مبشورة","2 ملعقة بقدونس","2 كوب عصير طماطم","ملعقة صلصة","ملح وفلفل وبهارات","2 ملعقة زيت"],steps:["اخلطي اللحم بالبصل والبقدونس والبهارات وشكليه كرات.","حمري الكرات في الزيت على دفعات ثم ارفعيها.","شوحي البصل في نفس الحلة وأضيفي الطماطم والصلصة والتوابل.","اتركي الصلصة تتسبك ثم أعيدي الكفتة.","غطي الحلة واطهي 15 إلى 20 دقيقة حتى تنضج الكفتة تمامًا."],tip:"لا تقلبي كرات الكفتة كثيرًا في بداية التحمير."},
{name:"مسقعة باللحمة المفرومة",cat:"غداء",emoji:"🍆",time:65,servings:5,img:"meat",ingredients:["2 باذنجان كبير","300 جرام لحم مفروم","بصلة","فلفلة","3 طماطم","3 فصوص ثوم","ملح وفلفل وكمون"],steps:["قطعي الباذنجان شرائح وجففيه بعد رشه بقليل من الملح.","حمريه في الفرن مع قليل من الزيت.","اطهي اللحم مع نصف البصل حتى ينضج.","شوحي باقي البصل والثوم والفلفل وأضيفي الطماطم والكمون.","رصي الباذنجان واللحم والصلصة في صينية واخبزي 20 دقيقة."],tip:"تحمير الباذنجان في الفرن يقلل كمية الزيت."},
{name:"كشري مصري",cat:"غداء",emoji:"🍛",time:75,servings:5,img:"rice",ingredients:["كوب أرز","كوب عدس بجبة","كوب مكرونة","كوب حمص مسلوق","2 بصلة","2 كوب عصير طماطم","4 فصوص ثوم","خل وكمون وزيت"],steps:["اسلقي العدس حتى يقترب من النضج.","حمري الشعرية ثم أضيفي الأرز والماء والملح واطهيه.","اسلقي المكرونة وصفيها.","حمري البصل شرائح حتى يصبح مقرمشًا.","اطهي عصير الطماطم مع الثوم والكمون حتى تتسبك الصلصة.","اخلطي الثوم والخل والكمون والماء لتحضير الدقة.","قدمي الأرز والعدس والمكرونة والحمص مع الصلصة والدقة والبصل."],tip:"حضري المكونات منفصلة ثم اجمعيها وقت التقديم."},
{name:"مكرونة بالبشاميل",cat:"غداء",emoji:"🍝",time:80,servings:6,img:"pasta",ingredients:["500 جرام مكرونة قلم","400 جرام لحم مفروم","بصلة","4 ملاعق زبدة","4 ملاعق دقيق","4 أكواب لبن","ملح وفلفل وجوزة الطيب"],steps:["اسلقي المكرونة أقل من النضج الكامل بدقيقتين.","شوحي البصل وأضيفي اللحم حتى ينضج.","ذوبي الزبدة وأضيفي الدقيق وقلبي دقيقة.","أضيفي اللبن تدريجيًا مع الخفق حتى يثقل البشاميل.","ضعي طبقة مكرونة ثم اللحم ثم باقي المكرونة والبشاميل.","اخبزي على 190 درجة 30 إلى 40 دقيقة حتى يحمر الوجه."],tip:"لا تسلقي المكرونة زيادة لأنها ستكمل نضجها في الفرن."},
{name:"فاصوليا بيضاء باللحمة",cat:"غداء",emoji:"🥘",time:100,servings:5,img:"soup",ingredients:["كوب ونصف فاصوليا بيضاء منقوعة","400 جرام لحم","بصلة","3 أكواب عصير طماطم","ملعقة صلصة","3 فصوص ثوم","ملح وفلفل"],steps:["انقعي الفاصوليا 8 ساعات على الأقل ثم اغسليها.","اسلقي اللحم حتى يقترب من النضج.","اسلقي الفاصوليا في ماء جديد حتى تلين جزئيًا.","اطهي الثوم والطماطم والصلصة حتى تتسبك.","أضيفي الفاصوليا واللحم والمرقة واطهي حتى تنضج الفاصوليا تمامًا."],tip:"مدة سلق الفاصوليا تختلف حسب نوعها وعمرها."},
{name:"بامية باللحمة",cat:"غداء",emoji:"🍲",time:90,servings:5,img:"soup",ingredients:["500 جرام بامية","400 جرام لحم","3 أكواب عصير طماطم","ملعقة صلصة","5 فصوص ثوم","كزبرة جافة","سمن وملح وفلفل"],steps:["اسلقي اللحم حتى يقترب من النضج.","اغسلي البامية وجففيها وأزيلي الجزء العلوي دون فتح القرون.","سبكي الطماطم والصلصة ثم أضيفي البامية واللحم وكوب مرقة.","اطهي على نار هادئة حتى تنضج البامية واللحمة.","حمري الثوم والكزبرة في السمن وأضيفي التقلية."],tip:"قلبي الحلة برفق حتى لا تتقطع قرون البامية."},
{name:"محشي كرنب",cat:"غداء",emoji:"🥬",time:110,servings:6,img:"rice",ingredients:["رأس كرنب","2 كوب أرز","بصلتان","كوب عصير طماطم","نصف كوب خضرة مفرومة","زيت وملح وفلفل وكمون","مرقة"],steps:["اسلقي أوراق الكرنب حتى تلين ثم صفيها وقطعيها.","اغسلي الأرز واخلطيه بالبصل والطماطم والخضرة والزيت والتوابل.","ضعي مقدارًا صغيرًا من الحشوة ولفي الأوراق.","رصي اللفائف في حلة واسكبي مرقة ساخنة حتى تقترب من مستواها.","اطهي على نار هادئة 35 إلى 50 دقيقة حتى ينضج الأرز."],tip:"اتركي فراغًا في اللفافة لأن الأرز يتمدد أثناء الطهي."},
{name:"محشي فلفل أخضر",cat:"غداء",emoji:"🫑",time:85,servings:5,img:"rice",ingredients:["8 حبات فلفل","كوب ونصف أرز","بصلة","كوب عصير طماطم","خضرة مفرومة","ملح وفلفل وكمون","مرقة"],steps:["اغسلي الفلفل وأزيلي البذور مع الاحتفاظ بالغطاء.","اخلطي الأرز المغسول بالبصل والطماطم والخضرة والتوابل.","املئي الفلفل حتى ثلاثة أرباعه فقط.","رصيه في حلة وأضيفي المرقة حوله.","غطي الحلة واطهي على نار هادئة حتى ينضج الأرز."],tip:"لا تملئي الفلفل للآخر حتى لا تخرج الحشوة."},
{name:"كبدة إسكندراني",cat:"غداء",emoji:"🥩",time:25,servings:3,img:"meat",ingredients:["500 جرام كبدة شرائح","4 فصوص ثوم","فلفلتان","2 ملعقة زيت","عصير ليمونة","كمون وكزبرة وملح وفلفل"],steps:["قطعي الكبدة وجففيها واحتفظي بها مبردة حتى الطهي.","سخني الزيت في طاسة واسعة.","أضيفي الكبدة على دفعات وقلبي حتى يتغير لونها.","أضيفي الثوم والفلفل والكمون والكزبرة والليمون.","اطهي حتى تنضج تمامًا ثم اضبطي الملح وقدميها."],tip:"لا تكدسي الكبدة في الطاسة حتى لا تخرج سوائل كثيرة."},
{name:"شاورما فراخ منزلية",cat:"غداء",emoji:"🌯",time:45,servings:4,img:"chicken",ingredients:["600 جرام دجاج شرائح","3 ملاعق زبادي","ملعقة خل","ليمونة","2 فص ثوم","بابريكا وكمون وكزبرة","ملح وفلفل","بصلة وفلفلة"],steps:["اخلطي الزبادي والخل والليمون والثوم والتوابل.","تبلي الدجاج واتركيه في الثلاجة نصف ساعة.","سخني طاسة واسعة واطهي الدجاج على دفعات.","أضيفي البصل والفلفل في آخر دقائق الطهي.","تأكدي من نضج الدجاج تمامًا وقدميه في الخبز."],tip:"الأوراك المخلية تظل طرية أكثر من الصدور."},
{name:"سمك صيادية",cat:"غداء",emoji:"🐟",time:55,servings:4,img:"fish",ingredients:["4 قطع سمك","2 كوب أرز","3 بصلات","3 ملاعق زيت","كمون وكزبرة","ملح وفلفل وليمون"],steps:["تبلي السمك بالملح والكمون والليمون.","حمري البصل حتى يصبح بنيًا دون احتراق.","أضيفي الماء الساخن والتوابل واتركيه يغلي.","أضيفي الأرز المغسول واطهيه حتى ينضج.","اشوي السمك أو اطهيه في طاسة حتى ينضج تمامًا وقدميه مع الأرز."],tip:"احتراق البصل يجعل طعم الصيادية مرًا."},
{name:"عدس أصفر بالشعرية",cat:"غداء",emoji:"🍲",time:40,servings:4,img:"soup",ingredients:["كوب ونصف عدس أصفر","جزرة","بصلة","طماطم","2 فص ثوم","6 أكواب ماء","ربع كوب شعرية","كمون وملح"],steps:["اغسلي العدس وضعيه مع الجزر والبصل والطماطم والثوم والماء.","اطهي 25 دقيقة حتى تلين المكونات.","اخلطي الشوربة بالخلاط حتى تصبح ناعمة.","حمري الشعرية في قليل من الزيت وأضيفيها للشوربة.","اطهي 8 دقائق واضبطي الملح والكمون والقوام."],tip:"خففي الشوربة بماء ساخن إذا ثقلت بعد الوقوف."},
{name:"حواوشي بلدي",cat:"غداء",emoji:"🥙",time:45,servings:4,img:"meat",ingredients:["500 جرام لحم مفروم","2 بصلة","فلفلة خضراء","طماطم صغيرة","4 أرغفة بلدي","ملح وفلفل وبهارات","ملعقتان زيت"],steps:["اخلطي اللحم بالبصل والفلفل والطماطم والتوابل.","قسمي الحشوة إلى أربعة أجزاء.","افتحي الأرغفة ووزعي الحشوة بطبقة رفيعة.","ادهني الخبز بقليل من الزيت.","اخبزي على 200 درجة نحو 20 إلى 25 دقيقة حتى تنضج الحشوة تمامًا ويتحمص الخبز."],tip:"اجعلي الحشوة رفيعة ومتساوية لضمان نضجها."},
{name:"أرز معمر حادق",cat:"غداء",emoji:"🍚",time:65,servings:4,img:"rice",ingredients:["2 كوب أرز مصري","2 كوب لبن","كوب مرقة","2 ملعقة قشطة","ملعقة زبدة","ملح وفلفل"],steps:["سخني الفرن إلى 180 درجة وادهني طاجنًا بالزبدة.","اغسلي الأرز وضعيه في الطاجن.","اخلطي اللبن والمرقة والملح والفلفل واسكبيها فوق الأرز.","وزعي القشطة والزبدة على الوجه.","اخبزي 45 إلى 60 دقيقة حتى يتشرب الأرز وينضج ويحمر الوجه."],tip:"إذا تحمر الوجه قبل نضج الأرز غطي الطاجن وأكملي التسوية."},
{name:"فراخ بالكريمة والمشروم",cat:"غداء",emoji:"🍗",time:40,servings:4,img:"chicken",ingredients:["500 جرام دجاج","200 جرام مشروم","بصلة","2 فص ثوم","كوب كريمة طبخ","ملعقة زبدة","ملح وفلفل وزعتر"],steps:["تبلي الدجاج بالملح والفلفل والزعتر.","حمري الدجاج في الزبدة على دفعات حتى ينضج تمامًا ثم ارفعيه.","شوحي البصل والثوم والمشروم حتى يتبخر ماء المشروم.","أعيدي الدجاج وأضيفي الكريمة.","اتركي الصوص دقائق على نار هادئة وقدميه مع المكرونة أو الأرز."],tip:"لا تضعي كمية كبيرة من الدجاج في الطاسة مرة واحدة."},

{name:"شكشوكة",cat:"سريعة",emoji:"🍳",time:18,servings:2,img:"soup",ingredients:["3 بيضات","2 طماطم","فلفلة","بصلة صغيرة","ملعقة زيت","ملح وفلفل وكمون"],steps:["شوحي البصل في الزيت حتى يذبل.","أضيفي الفلفل ثم الطماطم والكمون والملح.","اتركي الخليط حتى تتسبك الطماطم.","اصنعي فراغات واكسري البيض فيها.","غطي الطاسة حتى ينضج البياض تمامًا."],tip:"يمكن إضافة قليل من الماء إذا كانت الطماطم قليلة العصارة."},

const grid=document.getElementById("recipes"),details=document.getElementById("details"),search=document.getElementById("search");
let category="الكل",onlyFav=false,favorites=[];try{favorites=JSON.parse(localStorage.getItem("sofretnaFavs")||"[]");if(!Array.isArray(favorites))favorites=[]}catch(e){}
function render(){let list=recipes.filter(r=>(category==="الكل"||r.cat===category)&&(r.name+" "+r.ingredients.join(" ")+" "+r.cat).toLowerCase().includes(search.value.trim().toLowerCase())&&(!onlyFav||favorites.includes(r.name)));let s=document.getElementById("sort").value;if(s==="short")list.sort((a,b)=>a.time-b.time);if(s==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"ar"));grid.innerHTML="";document.getElementById("empty").hidden=!!list.length;list.forEach(r=>{let card=document.createElement("article");card.className="recipe";let photo=document.createElement("div");photo.className="photo";let emoji=document.createElement("span");emoji.className="emoji";emoji.textContent=r.emoji;let img=document.createElement("img");img.alt=r.name;img.loading="lazy";img.dataset.photo=r.img;img.src=photos[r.img];img.onerror=()=>img.classList.add("bad");let tag=document.createElement("small");tag.className="tag";tag.textContent=r.cat;photo.append(emoji,img,tag);let info=document.createElement("div");info.className="info";let h=document.createElement("h3");h.textContent=r.name;let p=document.createElement("p");p.className="muted";p.textContent="⏱️ "+r.time+" دقيقة · 👥 "+r.servings+" أفراد";let actions=document.createElement("div");actions.className="actions";let open=document.createElement("button");open.className="primary";open.textContent="عرض الوصفة";open.onclick=()=>openRecipe(r.name);let fav=document.createElement("button");fav.className="secondary";fav.textContent=favorites.includes(r.name)?"❤️":"🤍";fav.onclick=()=>toggleFavorite(r.name);actions.append(open,fav);info.append(h,p,actions);card.append(photo,info);grid.append(card)});}
function toggleFavorite(n){favorites=favorites.includes(n)?favorites.filter(x=>x!==n):[...favorites,n];try{localStorage.setItem("sofretnaFavs",JSON.stringify(favorites))}catch(e){}render()}
function openRecipe(name){let r=recipes.find(x=>x.name===name);if(!r)return;details.style.display="block";details.innerHTML="";let add=(tag,txt)=>{let e=document.createElement(tag);e.textContent=txt;details.append(e);return e};let close=add("button","✖ إغلاق");close.id="closeDetails";close.className="secondary";close.onclick=()=>details.style.display="none";add("h2",r.emoji+" "+r.name);add("p","⏱️ "+r.time+" دقيقة · 👥 تكفي "+r.servings+" أفراد · "+r.cat);add("div","اقرأ المقادير والخطوات كاملة قبل البدء وجهّز المكونات.");add("h3","🧺 المقادير");let ul=document.createElement("ul");r.ingredients.forEach(x=>{let li=document.createElement("li");li.textContent=x;ul.append(li)});details.append(ul);add("h3","👨‍🍳 طريقة التحضير");let ol=document.createElement("ol");r.steps.forEach(x=>{let li=document.createElement("li");li.textContent=x;ol.append(li)});details.append(ol);add("h3","💡 سر نجاح الوصفة");add("p",r.tip);let print=add("button","🖨️ طباعة الوصفة");print.className="primary";print.onclick=()=>window.print();details.scrollIntoView({behavior:"smooth",block:"start"})}
document.querySelectorAll("nav [data-cat]").forEach(b=>b.onclick=()=>{onlyFav=false;category=b.dataset.cat;document.querySelectorAll("nav [data-cat]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("favBtn").onclick=()=>{onlyFav=!onlyFav;category="الكل";document.querySelectorAll("nav [data-cat]").forEach(x=>x.classList.toggle("active",x.dataset.cat==="الكل"&&!onlyFav));render()};
search.oninput=render;document.getElementById("sort").onchange=render;document.getElementById("theme").onclick=()=>{document.body.classList.toggle("dark");try{localStorage.setItem("sofretnaDark",document.body.classList.contains("dark"))}catch(e){}};
try{if(localStorage.getItem("sofretnaDark")==="true")document.body.classList.add("dark")}catch(e){}document.getElementById("year").textContent=new Date().getFullYear();render();

/* تحميل الصور تلقائيًا إلى Cache Storage مرة واحدة، مع إعادة المحاولة للصور التي لم تكتمل. */
async function cacheRecipeImages(){if(!("caches" in window))return;const box=document.getElementById("downloadStatus"),txt=document.getElementById("downloadText"),bar=document.getElementById("progressBar");box.style.display="block";let cache;try{cache=await caches.open("sofretna-recipe-images-v1")}catch(e){txt.textContent="المتصفح لا يسمح بحفظ الصور تلقائيًا؛ ستظل الصور تعمل عند توفر الإنترنت.";return}
const urls=[...new Set(Object.values(photos))];let done=0,failed=0;for(const url of urls){try{const old=await cache.match(url);if(!old){const response=await fetch(url,{mode:"cors",cache:"force-cache"});if(!response.ok)throw Error("image");await cache.put(url,response.clone())}}catch(e){failed++}done++;bar.style.width=Math.round(done/urls.length*100)+"%";txt.textContent="تم تجهيز "+done+" من "+urls.length+" صور"+(failed?" · تعذر حفظ "+failed+" مؤقتًا":"");}
txt.textContent=failed?"اكتمل التحميل جزئيًا. الصور التي تعذر حفظها تحتاج اتصالًا بالإنترنت عند فتحها.":"اكتمل حفظ صور الوصفات! ستُعرض النسخ المحفوظة عند توفرها دون إنترنت.";setTimeout(()=>{box.style.display="none"},9000)}
async function useCachedImages(){if(!("caches" in window))return;try{const cache=await caches.open("sofretna-recipe-images-v1");document.querySelectorAll(".photo img").forEach(async img=>{const url=img.src;const hit=await cache.match(url);if(hit){const blob=await hit.blob();img.src=URL.createObjectURL(blob)}})}catch(e){}}
if(location.protocol.startsWith("http")){window.addEventListener("load",()=>{useCachedImages();cacheRecipeImages()})}
</script>
